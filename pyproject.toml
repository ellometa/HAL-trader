[project]
name = "hal"
version = "0.1.0"
description = "ICT-aware TradingView chat overlay backend"
requires-python = ">=3.11"
# Compatible-release pins (~=): patch updates ok, no surprise major bumps.
# google-genai is the NEW unified SDK (NOT google-generativeai).
dependencies = [
    "google-genai~=1.0",
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "python-dotenv~=1.0",
    "httpx~=0.27",
    "yfinance~=0.2",
    "pandas~=2.2",
    "pytest~=8.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "respx>=0.23.1",
]
